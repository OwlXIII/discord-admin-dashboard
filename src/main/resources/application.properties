spring.application.name=discord-admin-dashboard
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Discord OAuth2 + bot configuration.
# Secrets are read from environment variables so they are NEVER committed.
# Set them before running, e.g. (PowerShell):
#   $env:DISCORD_CLIENT_ID="..."; $env:DISCORD_CLIENT_SECRET="..."; $env:DISCORD_BOT_TOKEN="..."
# ---------------------------------------------------------------------------
discord.client-id=${DISCORD_CLIENT_ID:}
discord.client-secret=${DISCORD_CLIENT_SECRET:}
discord.redirect-uri=${DISCORD_REDIRECT_URI:http://localhost:8080/oauth/redirect}
discord.authorize-url=https://discord.com/api/oauth2/authorize
discord.token-url=https://discord.com/api/oauth2/token
discord.user-info-url=https://discord.com/api/users/@me
discord.guilds-url=https://discord.com/api/users/@me/guilds
discord.bot-token=${DISCORD_BOT_TOKEN:}

# Where the browser lands after a successful login.
app.dashboard-url=${APP_DASHBOARD_URL:http://localhost:8080/dashboard.html}
# true when served over HTTPS (marks the session cookie Secure).
app.cookie-secure=${APP_COOKIE_SECURE:false}

# JWT signing secret (base64, >= 32 bytes). Leave blank in dev to auto-generate
# an ephemeral key; set a stable value in production so sessions survive restarts.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.ttl-minutes=${APP_JWT_TTL_MINUTES:60}

logging.level.com.discordadmindashboard=INFO
